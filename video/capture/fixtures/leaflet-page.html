<!doctype html>
<!-- Recorder fixture (video/capture/record.test.mjs): a Leaflet map on local tiles only. The
     tiles are the four PNGs in fixtures/tiles/, served by fixtures/server.mjs with a small delay
     so the recorder's per-frame tile wait is exercised. No request leaves the machine. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recorder fixture: Leaflet</title>
  <link rel="stylesheet" href="/leaflet/leaflet.css">
  <style>
    html, body, #map { margin: 0; width: 100%; height: 100%; background: #1d2a1a; }
    #label { position: fixed; left: 24px; top: 24px; z-index: 1000; padding: 8px 14px; border-radius: 8px;
      background: rgba(255, 255, 255, .92); font: 600 20px/1.2 system-ui, sans-serif; color: #1d2a1a; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="label">Recorder fixture</div>
  <script src="/leaflet/leaflet.js"></script>
  <script>
    const map = L.map('map', { center: [20, 10], zoom: 3, zoomControl: true });
    L.tileLayer('/tiles/{z}/{x}/{y}.png', { maxZoom: 8, attribution: 'Fixture tiles' }).addTo(map);
    // Inside the take (on the virtual clock): a pan that brings new tiles into view.
    window.startFixtureMotion = () => setTimeout(() => map.panBy([360, 180], { animate: true, duration: 0.6 }), 400);
  </script>
</body>
</html>
