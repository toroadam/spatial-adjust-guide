name: Screen fidelity

# A SEPARATE workflow from deploy.yml so the full picture — provenance breakdown, cursor targets,
# the advisory product-locale audit — is visible on every commit and pull request, not only on the
# pushes that deploy. deploy.yml runs the gate on its own as a blocking step; this one is where you
# come to read WHY.
#
# The gate was advisory while the four Target Profiles guides depicted a three-card list against a
# product shipping a five-slot table. That tab turned out to be unmerged, so the gate
# now forgives it by fact rather than by exception, and it blocks deploys.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No browser and no credentials. The gate reads src/i18n/product-labels.json, a fixture
      # harvested from a live instance by a human running `npm run fidelity:harvest`. Toro SSO
      # enforces MFA and cannot be driven headlessly, so CI diffs against the committed fixture
      # rather than logging in. The fixture carries product labels only — values are scrubbed at
      # harvest time because this repository is public.
      # Cheap, no fixture and no checkout needed. Runs first because a broken classifier
      # makes every number below it meaningless — and it silently was once, when an
      # unanchored pattern read "-5 " inside "-5 to 5%" and called a numeric range a label.
      - name: Provenance classifier self-check
        run: npm run test:provenance

      # Grammar classes that bulk term replacement breaks and validate-locales cannot see:
      # Korean particle agreement after the nouns this project substituted, French elision, and
      # stray double spaces. Rules that could not tell correct prose from broken prose were
      # removed rather than tuned — see the header of scripts/prose-lint.mjs.
      - name: Prose lint
        run: npm run test:prose

      # Runs BEFORE the gate because it checks the gate itself. The in-flight tab set and the
      # station-level header were once read from an IntelliDash checkout at run time, so the gate
      # passed locally and failed here — on exactly the labels it exists to forgive, and only
      # after a green local suite. This asserts the verdict is identical with and without a
      # checkout, which is the property that makes the gate below mean anything in CI.
      - name: Gate parity (same verdict with and without a checkout)
        run: npm run test:parity

      - name: Fidelity gate (product -> reproduction)
        run: npm run test:fidelity

      # Runs even when the gate fails, so the provenance breakdown is in the log next to the
      # failure rather than needing a second run to see it.
      #
      # In CI the provenance columns degrade to zero: resolving a label to an i18n key or a
      # hardcoded literal needs an IntelliDash checkout, which is in Azure DevOps and not
      # available here. The GATE is unaffected — it reads only the committed fixture — so the
      # build still fails on a real divergence. Run it locally with a checkout for the full
      # classification, including which template hardcodes which label.
      - name: Provenance report
        if: always()
        run: node scripts/fidelity.mjs --report

      # The animated cursor must land on the control each step names. Gates on cursors that miss
      # the stage entirely; a cursor on the wrong labelled control is reported but advisory,
      # because a step can legitimately point at a region rather than a label.
      # The only step here that needs a browser. npm ci installs the Playwright package but not
      # its binaries, so without this the step dies before it checks a single cursor — which it
      # did, silently reducing this workflow to a red X nobody could act on.
      - name: Install Chromium for the cursor check
        run: npx playwright install --with-deps chromium

      - name: Cursor target check
        run: |
          npm run build
          node scripts/serve.mjs dist 8124 &
          sleep 3
          node scripts/cursor-target.mjs http://localhost:8124/

      # Product-side locale audit. Needs an IntelliDash checkout, which is in Azure DevOps and
      # not reachable here, so in CI this prints a note and exits zero. It is listed anyway so
      # the command is discoverable, and because it is the step to run locally before handing
      # findings to IntelliDash Software: the guides ship in eleven languages and roughly half
      # the Spatial Adjust keys are missing from every non-English catalogue, which no change
      # to this repository can fix.
      - name: Product locale audit (advisory, needs a checkout)
        if: always()
        run: npm run test:product-locales
