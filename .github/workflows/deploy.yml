name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel a run that's mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The followability gates. Each needs no browser, no credentials and no IntelliDash
      # checkout (they read the guide data in memory and the committed fixtures), so they run
      # first and fail fast, before Chromium is installed. All four block the deploy; left
      # advisory they would have become furniture, as the screen-label findings did below.
      #   test:validate     every locale catalogue against the English, plus label provenance and marker drift
      #   test:prose        mechanical grammar checks over the translated catalogues
      #   test:shape        every step has Do, You should see and If not; the glossary is sound
      #   test:readability  no step above Flesch-Kincaid grade 8
      # build.mjs runs the shape check again inside `npm test`, so dist/ cannot be built from a
      # guide that breaks the step standard even if this step were removed.
      - name: Locale catalogues (test:validate)
        run: npm run test:validate

      - name: Prose lint (test:prose)
        run: npm run test:prose

      - name: Step shape (test:shape)
        run: npm run test:shape

      - name: Readability, grade 8 or below (test:readability)
        run: npm run test:readability

      # The smoke test drives a real browser, so it needs the matching Chromium.
      - run: npx playwright install --with-deps chromium

      # Videos are GitHub Release assets and never git objects; a tracked video file or a Git LFS
      # filter fails here, before anything is built. The checkout is depth 1, so this sees the
      # tracked tree only; run the same command in a full clone to scan history as well.
      - name: No video files in git
        run: npm run test:media-git

      # Release media is staged in .media/ and kept between runs. The key changes whenever the
      # manifest does; restore-keys brings back the previous wave's cache, so a new wave downloads
      # only its new assets. Nothing in the cache is trusted as-is: the next step re-hashes every file.
      - uses: actions/cache@v4
        with:
          path: .media
          key: media-${{ hashFiles('src/media/manifest.json') }}
          restore-keys: |
            media-

      # Downloads every asset the manifest pins from the public release into .media/ and checks its
      # SHA-256. The build copies them into dist/media/, so the page still loads from its own origin
      # only. The built-in GITHUB_TOKEN only softens rate limits; this job keeps contents: read.
      - name: Stage release media
        run: npm run media:fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Builds dist/, then boots it with every external host blocked and asserts
      # it renders. A regression that reintroduces a CDN dependency fails here.
      # The feedback endpoint is injected here, from a secret, so it never enters the repo —
      # see the comment above the injection loop in build.mjs.
      # SA_MEDIA_REQUIRED makes a manifest item with no staged asset fail the build instead of
      # quietly shipping that guide without its video, which is what a local build does.
      - run: npm test
        env:
          # The beta switch (README: Beta content and the customer launch). A repository variable,
          # not a secret: it is a setting, not a credential, and its value shows in the log. Empty
          # or unset, which is what this expression gives until the variable exists, means the build
          # default: beta content shown, with its Beta labels. For the customer launch, set it to
          # false and re-run this workflow; build.mjs then leaves beta content out of dist/. An
          # Azure pipeline sets the same environment variable, with no code change.
          SA_SHOW_BETA: ${{ vars.SA_SHOW_BETA }}
          SA_FEEDBACK_ENDPOINT: ${{ secrets.SA_FEEDBACK_ENDPOINT }}
          SA_MEDIA_REQUIRED: '1'

      # Reads every file in the dist/ the steps below upload. With SA_SHOW_BETA false it fails the
      # deploy on any beta guide key, title, step or string in any file or locale, and on a dist/
      # built in the other mode; with beta shown it reports and passes. It must see the same
      # SA_SHOW_BETA as the build above, so a mismatch between the two env blocks fails closed.
      - name: Beta leak check
        run: node scripts/beta-leak.mjs
        env:
          SA_SHOW_BETA: ${{ vars.SA_SHOW_BETA }}

      # Blocking as of 2026-09-12. It ran as its own advisory workflow while the Target Profiles
      # figures were red; that is resolved — those labels belong to an unmerged feature branch and
      # are now reported rather than gated — so the gate is green and can hold the deploy.
      #
      # Left advisory it would have become furniture, which is exactly what happened to the 308
      # screen-label findings nobody actioned. It needs no browser, no credentials and no
      # IntelliDash checkout: it reads the committed fixture. That last claim was written before
      # it was true — the gate quietly read a checkout for two facts, so it passed on a laptop and
      # failed here, on the first deploy it guarded. Both facts now travel in the fixture, and the
      # parity step below is what keeps the claim honest.
      - name: Gate parity (same verdict with and without a checkout)
        run: npm run test:parity

      - name: Screen-fidelity gate
        run: npm run test:fidelity

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
